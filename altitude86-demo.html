<meta property="og:description" content="Trois directions artistiques, une seule interface. Démo interactive d'une marque outdoor haut de gamme." />
<meta property="og:type" content="website" />

<style>
  :root {
    --ink: oklch(0.14 0 0);
    --paper: oklch(0.97 0.002 90);
    --accent-signal: oklch(0.68 0.2 42);
    --ease-swift: cubic-bezier(0.16, 1, 0.3, 1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    font-family: 'Archivo', sans-serif;
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    cursor: none;
    transition: background-color .65s var(--ease-swift), color .65s var(--ease-swift);
  }

  /* ---- mode themes ---- */
  body[data-mode="minimal"]   { --bg: var(--paper); --fg: var(--ink);
    --sub: color-mix(in oklab, var(--ink) 55%, transparent);
    --rule: color-mix(in oklab, var(--ink) 15%, transparent); }
  body[data-mode="bold"]      { --bg: var(--ink);   --fg: var(--paper);
    --sub: color-mix(in oklab, var(--paper) 55%, transparent);
    --rule: color-mix(in oklab, var(--paper) 20%, transparent); }
  body[data-mode="editorial"] { --bg: oklch(0.93 0.012 80); --fg: var(--ink);
    --sub: color-mix(in oklab, var(--ink) 60%, transparent);
    --rule: color-mix(in oklab, var(--ink) 25%, transparent); }

  .stage {
    height: 100vh; height: 100dvh;
    display: flex; flex-direction: column;
    position: relative; overflow: hidden;
  }

  /* ---- header ---- */
  header {
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--rule);
    padding: 1rem 2rem;
    transition: border-color .65s var(--ease-swift);
  }
  .brand-wrap { display: flex; align-items: baseline; gap: 1rem; }
  .brand { font-size: 15px; letter-spacing: .18em; transition: all .65s var(--ease-swift); }
  body[data-mode="bold"] .brand { font-family: 'Anton', sans-serif; text-transform: uppercase; }
  body[data-mode="editorial"] .brand { font-family: 'Instrument Serif', serif; font-style: italic; }
  .eyebrow { text-transform: uppercase; color: var(--sub); transition: color .65s var(--ease-swift); }
  .eyebrow-a { letter-spacing: .42em; font-size: 10px; }
  body[data-mode="bold"] .eyebrow-a { letter-spacing: .3em; font-weight: 600; }
  body[data-mode="editorial"] .eyebrow-a { letter-spacing: .5em; }
  @media (max-width: 768px) { .eyebrow-a { display: none; } }

  .mode-switch {
    position: relative; display: grid; grid-template-columns: repeat(3, auto);
    border: 1px solid var(--rule); transition: border-color .65s var(--ease-swift);
  }
  .indicator {
    position: absolute; top: 0; left: 0; height: 100%; width: calc(100% / 3);
    background: var(--accent-signal);
    transition: transform .7s cubic-bezier(0.77, 0, 0.18, 1);
  }
  .mode-btn {
    position: relative; z-index: 1; cursor: none;
    padding: .625rem 1.5rem; font-size: 10px; text-transform: uppercase;
    letter-spacing: .28em; background: none; border: none; font-family: inherit;
    color: var(--sub); transition: all .65s var(--ease-swift);
  }
  .mode-btn.active { color: var(--ink); }
  .mode-btn:not(.active):hover { transform: translateY(-2px); letter-spacing: .4em; }
  @media (max-width: 640px) { .mode-btn { padding: .5rem .9rem; } }
  .eyebrow-b { letter-spacing: .42em; font-size: 10px; }
  @media (max-width: 1024px) { .eyebrow-b { display: none; } }

  /* ---- main grid ---- */
  main {
    flex: 1; min-height: 0;
    display: grid; align-items: center;
    padding: 1.5rem 2rem;
    transition: all .65s var(--ease-swift);
  }
  body[data-mode="minimal"]   main { grid-template-columns: 1.05fr .95fr; gap: 4rem; }
  body[data-mode="bold"]      main { grid-template-columns: 1.35fr .65fr; gap: 2.5rem; }
  body[data-mode="editorial"] main { grid-template-columns: .82fr 1.18fr; gap: 3.5rem; }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr !important; overflow-y: auto; }
  }

  .copy { display: flex; flex-direction: column; justify-content: center; gap: 1.5rem; min-height: 0; }

  .kicker { color: var(--sub); }

  h1 {
    transition: all .65s var(--ease-swift);
  }
  body[data-mode="minimal"] h1 {
    font-family: 'Archivo', sans-serif; font-weight: 500;
    letter-spacing: -.055em; line-height: .92; text-transform: uppercase;
    font-size: clamp(2.6rem, 6.4vw, 6.4rem);
  }
  body[data-mode="bold"] h1 {
    font-family: 'Anton', sans-serif; font-weight: 400;
    letter-spacing: -.02em; line-height: .88; text-transform: uppercase;
    font-size: clamp(3rem, 7.8vw, 8rem);
  }
  body[data-mode="editorial"] h1 {
    font-family: 'Instrument Serif', serif; font-style: italic; font-weight: 400;
    letter-spacing: -.02em; line-height: .88;
    font-size: clamp(3rem, 7.6vw, 7.6rem);
  }
  .h-line {
    display: block; overflow: hidden;
    margin-top: -.26em; padding-top: .26em; padding-bottom: .06em;
    will-change: transform;
  }
  .accent-word {
    display: inline-block; color: var(--accent-signal);
    transition: transform .5s var(--ease-swift);
  }
  .accent-word:hover { transform: skewX(-12deg) scale(1.1); }

  .lead { color: var(--sub); transition: all .65s var(--ease-swift); }
  body[data-mode="minimal"] .lead { max-width: 34ch; font-size: 13px; line-height: 1.625; }
  body[data-mode="bold"] .lead { max-width: 30ch; font-size: 13px; line-height: 1.375; font-weight: 500; }
  body[data-mode="editorial"] .lead { max-width: 38ch; font-size: 13.5px; line-height: 1.7; columns: 2; column-gap: 1.75rem; }

  .cta-row { display: flex; align-items: center; gap: 1.75rem; }
  .cta {
    cursor: none; background: none; font-family: inherit;
    transition: all .65s var(--ease-swift);
  }
  body[data-mode="minimal"] .cta {
    border: 1px solid var(--ink); border-radius: 0; color: var(--fg);
    padding: .75rem 2rem; font-size: 11px; letter-spacing: .3em; text-transform: uppercase;
  }
  body[data-mode="minimal"] .cta:hover { background: var(--ink); color: var(--paper); }
  body[data-mode="bold"] .cta {
    border: none; border-radius: 0; background: var(--accent-signal); color: var(--ink);
    padding: 1rem 2.5rem; font-size: 12px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase;
  }
  body[data-mode="bold"] .cta:hover { transform: scale(1.04); }
  body[data-mode="editorial"] .cta {
    border: none; border-bottom: 1px solid var(--ink); border-radius: 0; color: var(--fg);
    padding: .25rem; font-size: 12px; letter-spacing: .26em; text-transform: uppercase;
  }
  body[data-mode="editorial"] .cta:hover { letter-spacing: .4em; }
  .ship { color: var(--sub); font-size: 11px; letter-spacing: .26em; text-transform: uppercase; }

  /* ---- stats ---- */
  .stats { position: relative; margin-top: .5rem; display: grid; grid-template-columns: repeat(3, 1fr); padding-top: 1.25rem; }
  .stats-rule { position: absolute; top: 0; left: 0; height: 1px; width: 100%; background: var(--fg); opacity: .25; }
  .stat { padding-right: 1.25rem; }
  .stat + .stat { border-left: 1px solid var(--rule); padding-left: 1.25rem; transition: border-color .65s var(--ease-swift); }
  .stat-num {
    font-size: clamp(1.9rem, 3.4vw, 3.2rem); line-height: 1;
    font-variant-numeric: tabular-nums; transition: all .65s var(--ease-swift);
  }
  body[data-mode="minimal"] .stat-num { font-family: 'Archivo', sans-serif; font-weight: 500; letter-spacing: -.04em; }
  body[data-mode="bold"] .stat-num { font-family: 'Anton', sans-serif; font-weight: 400; letter-spacing: -.01em; }
  body[data-mode="editorial"] .stat-num { font-family: 'Instrument Serif', serif; font-style: italic; letter-spacing: -.01em; }
  .stat-label { color: var(--sub); margin-top: .5rem; font-size: 10px; letter-spacing: .24em; text-transform: uppercase; }

  /* ---- image column ---- */
  .imgcol { position: relative; height: 100%; min-height: 0; padding: .5rem 0; }
  .tilt { position: relative; height: 100%; width: 100%; transform-style: preserve-3d; transition: transform .2s linear; }
  .img-in { position: relative; height: 100%; width: 100%; overflow: hidden; }
  .hero-img {
    height: 100%; width: 100%; object-fit: cover; will-change: transform;
    transition: all .65s var(--ease-swift);
  }
  body[data-mode="minimal"] .hero-img { filter: grayscale(1) contrast(1.05) brightness(1.1); }
  body[data-mode="bold"] .hero-img { filter: grayscale(1) contrast(1.6) brightness(.75) saturate(0); }
  body[data-mode="editorial"] .hero-img { filter: sepia(.25) grayscale(.8) contrast(1.1); clip-path: polygon(0 0, 100% 4%, 100% 96%, 0 100%); }
  .light {
    pointer-events: none; position: absolute; inset: 0; mix-blend-mode: overlay;
    transition: opacity .5s;
  }
  .sweep {
    pointer-events: none; position: absolute; inset: 0;
    background: var(--accent-signal); mix-blend-mode: multiply;
    clip-path: inset(100% 0 0 0);
    transition: clip-path .8s cubic-bezier(0.77, 0, 0.18, 1);
  }
  body[data-mode="bold"] .sweep { opacity: .55; }
  body[data-mode="minimal"] .sweep, body[data-mode="editorial"] .sweep { opacity: .3; }
  .imgcol:hover .sweep { clip-path: inset(0 0 0 0); }

  .plate-wrap { position: absolute; bottom: 1.25rem; left: 1.25rem; width: 32%; max-width: 190px; will-change: transform; transition: opacity .65s var(--ease-swift); }
  body[data-mode="minimal"] .plate-wrap { opacity: 0; }
  .plate { overflow: hidden; box-shadow: 0 25px 50px -12px rgb(0 0 0 / .4); }
  .detail-img { aspect-ratio: 3/4; width: 100%; height: auto; object-fit: cover; transition: all .65s var(--ease-swift); }
  body[data-mode="minimal"] .detail-img { filter: grayscale(1) contrast(1.05) brightness(1.1); }
  body[data-mode="bold"] .detail-img { filter: grayscale(1) contrast(1.6) brightness(.75) saturate(0); }
  body[data-mode="editorial"] .detail-img { filter: sepia(.25) grayscale(.8) contrast(1.1); }

  .badge {
    position: absolute; top: 1rem; right: 1rem;
    background: var(--accent-signal); color: var(--ink);
    padding: .25rem .75rem; font-size: 10px; letter-spacing: .26em; text-transform: uppercase;
    will-change: transform;
  }

  /* ---- footer ticker ---- */
  footer {
    flex-shrink: 0; border-top: 1px solid var(--rule); overflow: hidden;
    padding: .625rem 0; transition: border-color .65s var(--ease-swift);
  }
  .marquee { display: flex; gap: 2.5rem; width: max-content; white-space: nowrap; animation: marquee-x 22s linear infinite; }
  .marquee > div { display: flex; gap: 2.5rem; }
  .tick { color: var(--sub); font-size: 10px; letter-spacing: .34em; text-transform: uppercase; transition: color .65s var(--ease-swift); }
  .tick em { font-style: normal; color: var(--accent-signal); }
  @keyframes marquee-x { from { transform: translateX(0); } to { transform: translateX(-50%); } }

  /* ---- entrance animations (replayed on each mode switch) ---- */
  @keyframes rise-in { from { opacity: 0; transform: translateY(1.1em) rotate(2deg); } to { opacity: 1; transform: translateY(0) rotate(0); } }
  @keyframes mask-up { from { transform: translateY(110%) skewY(7deg); } to { transform: translateY(0) skewY(0); } }
  @keyframes img-reveal { from { clip-path: inset(0 0 100% 0); transform: scale(1.35); filter: blur(10px); } to { clip-path: inset(0 0 0 0); transform: scale(1); filter: blur(0); } }
  @keyframes plate-in { from { opacity: 0; transform: translateY(60px) rotate(-8deg) scale(.85); } to { opacity: 1; transform: none; } }
  @keyframes rule-grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .anim .rise { animation: rise-in .8s var(--ease-swift) both; }
  .anim .mask-line { display: block; animation: mask-up 1s var(--ease-swift) both; }
  .anim .img-in { animation: img-reveal 1.15s cubic-bezier(0.77, 0, 0.18, 1) both; }
  .anim .plate-in { animation: plate-in 1s var(--ease-swift) .35s both; }
  .anim .rule-grow { transform-origin: left; animation: rule-grow 1.1s var(--ease-swift) .3s both; }

  /* ---- wipe transition ---- */
  .wipe-layer { pointer-events: none; position: fixed; inset: 0; z-index: 50; overflow: hidden; }
  @keyframes wipe-sweep {
    0% { transform: translateX(-101%) skewX(-12deg); }
    45% { transform: translateX(0%) skewX(0deg); }
    55% { transform: translateX(0%) skewX(0deg); }
    100% { transform: translateX(101%) skewX(12deg); }
  }
  .wipe { position: absolute; inset: -10%; animation: wipe-sweep .9s cubic-bezier(0.77, 0, 0.18, 1) both; }
  .wipe-accent { background: var(--accent-signal); display: flex; align-items: center; justify-content: center; }
  .wipe-ink { background: var(--ink); mix-blend-mode: multiply; opacity: .25; }
  @keyframes wipe-label {
    0%, 25% { opacity: 0; transform: translateY(40%) scale(.9); letter-spacing: .6em; }
    50% { opacity: 1; transform: translateY(0) scale(1); letter-spacing: -.02em; }
    70% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-30%) scale(1.05); }
  }
  .wipe-text {
    font-family: 'Anton', sans-serif; font-size: 18vw; line-height: 1;
    color: var(--ink); text-transform: uppercase;
    animation: wipe-label .9s var(--ease-swift) both;
  }

  /* ---- custom cursor ---- */
  .cursor {
    pointer-events: none; position: fixed; top: 0; left: 0; z-index: 60;
    border-radius: 9999px; background: var(--paper); mix-blend-mode: difference;
    transition: width .45s var(--ease-swift), height .45s var(--ease-swift);
  }
  @media (hover: none) { body { cursor: auto; } .cursor { display: none; } .mode-btn, .cta { cursor: pointer; } }

  .portfolio-back{
    position:fixed;top:18px;left:18px;z-index:9999;
    display:inline-flex;align-items:center;gap:9px;
    padding:9px 12px;
    font-family:'Archivo',sans-serif;font-size:10px;font-weight:600;
    letter-spacing:.14em;text-transform:uppercase;text-decoration:none;
    color:var(--fg);background:color-mix(in oklab,var(--bg) 82%,transparent);
    border:1px solid var(--rule);
    backdrop-filter:blur(8px);
    transition:transform .25s var(--ease-swift),background-color .25s var(--ease-swift),color .25s var(--ease-swift);
  }
  .portfolio-back:hover{transform:translateX(-3px);background:var(--accent-signal);color:var(--ink)}
  @media(max-width:640px){.portfolio-back{top:12px;left:12px;padding:8px 10px}}
</style>

<script>
(function () {
  "use strict";

  var MODES = {
    minimal: {
      label: "Minimal",
      headline: ["Le", "silence", "en altitude"],
      lead: "Une collection réduite à l'essentiel. Quatre pièces, trois saisons, zéro superflu."
    },
    bold: {
      label: "Bold",
      headline: ["Rien", "ne nous", "arrête"],
      lead: "Testé à −38 °C sur l'arête nord. Conçu pour ceux qui n'attendent pas la météo."
    },
    editorial: {
      label: "Editorial",
      headline: ["Chronique", "des hautes", "latitudes"],
      lead: "Carnet de terrain, numéro 86. Granite, brouillard et lumière rase : trois semaines au-dessus de la mer de nuages, sans redescendre."
    }
  };

  var TICKER = ["Gore-Tex Pro 3L", "Coutures étanchéifiées", "−38 °C testé terrain", "Fabriqué en Europe", "Réparation à vie", "Série limitée 86"];

  var stage = document.getElementById("stage");
  var cursor = document.getElementById("cursor");
  var indicator = document.getElementById("indicator");
  var badge = document.getElementById("badge");
  var headline = document.getElementById("headline");
  var lead = document.getElementById("lead");
  var tilt = document.getElementById("tilt");
  var hero = document.getElementById("hero");
  var light = document.getElementById("light");
  var plate = document.getElementById("plate");
  var detail = document.getElementById("detail");
  var imgcol = document.getElementById("imgcol");

  var mode = "minimal";
  var switching = false;
  var imgHover = false;
  var p = { x: 0, y: 0 };
  var target = { x: 0, y: 0, cx: -100, cy: -100, hot: false };
  var now = { x: 0, y: 0, cx: -100, cy: -100 };

  /* ---- ticker ---- */
  var mq = document.getElementById("marquee");
  for (var k = 0; k < 2; k++) {
    var row = document.createElement("div");
    TICKER.forEach(function (w) {
      var s = document.createElement("span");
      s.className = "tick";
      s.innerHTML = w + " <em>/</em>";
      row.appendChild(s);
    });
    mq.appendChild(row);
  }

  /* ---- headline ---- */
  function renderHeadline() {
    headline.innerHTML = "";
    MODES[mode].headline.forEach(function (line, i) {
      var wrap = document.createElement("span");
      wrap.className = "h-line";
      var mask = document.createElement("span");
      mask.className = "mask-line";
      mask.style.animationDelay = (120 + i * 110) + "ms";
      if (i === 2) {
        var words = line.split(" ");
        var acc = document.createElement("span");
        acc.className = "accent-word";
        acc.textContent = words[0];
        mask.appendChild(acc);
        if (words.length > 1) mask.appendChild(document.createTextNode(" " + words.slice(1).join(" ")));
      } else {
        mask.textContent = line;
      }
      wrap.appendChild(mask);
      headline.appendChild(wrap);
    });
  }

  /* ---- counters ---- */
  function runCounters() {
    document.querySelectorAll(".stat-num").forEach(function (el) {
      var to = parseInt(el.getAttribute("data-to"), 10);
      var suffix = el.getAttribute("data-suffix") || "";
      var start = performance.now();
      var dur = 1100;
      function tick(t) {
        var prog = Math.min((t - start) / dur, 1);
        var eased = 1 - Math.pow(1 - prog, 4);
        el.textContent = Math.round(to * eased) + suffix;
        if (prog < 1) requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    });
  }

  /* ---- wipe ---- */
  function playWipe(label) {
    var layer = document.createElement("div");
    layer.className = "wipe-layer";
    var accent = document.createElement("div");
    accent.className = "wipe wipe-accent";
    var txt = document.createElement("span");
    txt.className = "wipe-text";
    txt.textContent = label;
    accent.appendChild(txt);
    var ink = document.createElement("div");
    ink.className = "wipe wipe-ink";
    ink.style.animationDelay = "90ms";
    layer.appendChild(accent);
    layer.appendChild(ink);
    document.body.appendChild(layer);
    setTimeout(function () { layer.remove(); }, 1100);
  }

  /* ---- mode switch ---- */
  function setMode(m) {
    if (m === mode || switching) return;
    switching = true;
    playWipe(MODES[m].label);
    setTimeout(function () {
      mode = m;
      document.body.setAttribute("data-mode", m);
      document.querySelectorAll(".mode-btn").forEach(function (b) {
        b.classList.toggle("active", b.getAttribute("data-mode-btn") === m);
      });
      var idx = Object.keys(MODES).indexOf(m);
      indicator.style.transform = "translateX(" + idx * 100 + "%)";
      badge.textContent = m;
      lead.textContent = MODES[m].lead;
      stage.classList.remove("anim");
      void stage.offsetWidth;
      renderHeadline();
      stage.classList.add("anim");
      runCounters();
      switching = false;
    }, 380);
  }

  document.querySelectorAll(".mode-btn").forEach(function (b) {
    b.addEventListener("click", function () { setMode(b.getAttribute("data-mode-btn")); });
  });

  /* ---- pointer tracking ---- */
  stage.addEventListener("pointermove", function (e) {
    var r = stage.getBoundingClientRect();
    target.x = (e.clientX - r.left) / r.width - 0.5;
    target.y = (e.clientY - r.top) / r.height - 0.5;
    target.cx = e.clientX;
    target.cy = e.clientY;
    target.hot = !!(e.target.closest && e.target.closest("button"));
  });
  imgcol.addEventListener("pointerenter", function () { imgHover = true; });
  imgcol.addEventListener("pointerleave", function () { imgHover = false; });

  /* ---- animation loop ---- */
  function loop() {
    now.x += (target.x - now.x) * 0.08;
    now.y += (target.y - now.y) * 0.08;
    now.cx += (target.cx - now.cx) * 0.22;
    now.cy += (target.cy - now.cy) * 0.22;
    p.x = now.x; p.y = now.y;

    var lines = headline.querySelectorAll(".h-line");
    for (var i = 0; i < lines.length; i++) {
      lines[i].style.transform = "translate(" + (p.x * (i + 1) * -18) + "px, " + (p.y * (i + 1) * -6) + "px)";
    }

    tilt.style.transform = "perspective(1200px) rotateY(" + (p.x * 14) + "deg) rotateX(" + (-p.y * 12) + "deg) scale(" + (imgHover ? 1.02 : 1) + ")";
    hero.style.transform = "scale(" + (imgHover ? 1.28 : 1.14) + ") translate(" + (p.x * -40) + "px, " + (p.y * -40) + "px)";
    light.style.background = "radial-gradient(circle at " + ((p.x + 0.5) * 100) + "% " + ((p.y + 0.5) * 100) + "%, color-mix(in oklab, var(--paper) 70%, transparent) 0%, transparent 45%)";
    light.style.opacity = imgHover ? 1 : 0.45;
    plate.style.transform = "translate3d(" + (p.x * 70) + "px, " + (p.y * 70) + "px, 60px) rotate(" + (p.x * 6) + "deg)";
    badge.style.transform = "translate3d(" + (p.x * -30) + "px, " + (p.y * -30) + "px, 40px)";
    detail.style.transform = "scale(" + (imgHover ? 1.15 : 1) + ")";

    var size = target.hot ? 64 : (imgHover ? 110 : 14);
    cursor.style.width = size + "px";
    cursor.style.height = size + "px";
    cursor.style.transform = "translate(" + now.cx + "px, " + now.cy + "px) translate(-50%, -50%)";

    requestAnimationFrame(loop);
  }

  /* ---- init ---- */
  renderHeadline();
  runCounters();
  requestAnimationFrame(loop);
})();
</script>

<script>
(function(){
  const q = new URLSearchParams(location.search);
  if(q.get('preview') !== '1') return;
  document.documentElement.classList.add('is-preview');
  const style = document.createElement('style');
  style.textContent = `
    .is-preview body{cursor:default!important}
    .is-preview .cursor{display:none!important}
    .is-preview .mode-btn,.is-preview .cta{pointer-events:none!important}
  `;
  document.head.appendChild(style);
  const modes = ['minimal','bold','editorial'];
  let i = 0;
  function step(){
    const btn = document.querySelector('[data-mode-btn="'+modes[i % modes.length]+'"]');
    if(btn) btn.click();
    i++;
  }
  setTimeout(()=>{ i=1; step(); setInterval(step, 1900); }, 1600);
})();
</script>
